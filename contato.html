<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <header class="cabecalho">
        <div class="logo">
            <i class="fa-solid fa-earth-americas"></i>
            <span>Explore o Mundo com SkyAirplane</span>
        </div>
        <div class="navegacao">
            <nav class="menu-links">
                <a href="index.html">Início</a>
                <a href="destinos.html">Destinos</a>
                <a href="sobre.html">Sobre</a>
                <a href="contato.html">Contato</a>
                <a href="finalizar.html">Finalizar</a>
            </nav>
            <div class="redes-sociais">
                <a href="" class="whatsapp"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="" class="instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="" class="facebook"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="" class="x"><i class="fa-brands fa-x-twitter"></i></a>
            </div>
        </div>
    </header> 

      <h1 class="compra-passagem">Converse conosco</h1>

<section class="tudo">
        <form class="formulario">
            <label>Nome completo:</label>
            <input type="text" name="cliente" required><br>

            <label>Email:</label>
            <input type="text" name="email" required><br>

            <label>Telefone:</label>
            <input type="number" name="telefone" required><br>

            <label>Data de Nascimento:</label>
            <input type="date" name="dn" required><br><br>

            <label>Tipo de Passagem</label>
            <select name="status">
                <option value="INCLUSO">AirBnb INCLUSO</option>
                <option value="NÃO INCLUSO">AirBnb NÃO INCLUSO</option>
            </select><br>

            <label>Aeroportos</label>
            <select name="status">
                <option value="SJRP">São José do Rio Preto</option>
                <option value="Congonhas">Congonhas</option>
                <option value="Guarulhos">Guarulhos</option>
            </select><br>

            <label>Destino (Viagem Internacional)</label>
            <select name="status">
                <option value="França">França</option>
                <option value="Espanha">Espanha</option>
                <option value="Estados Unidos">Estados Unidos</option>
                <option value="Nenhum">Nenhum</option>
            </select><br>

            <label>Destino (Viagem Nacional)</label>
            <select name="status">
            <option value="Lençóis Maaranhenses">Lençóis Maranhenses</option>
            <option value="Búzios">Búzios</option>
            <option value="Esoírito Santo do Pinhal">Espírito Santo do Pinhal</option>
            <option value="Nenhum">Nenhum</option>
            </select><br><br>

            <label class="assunto">Assunto:</label>
            <textarea type="text" name="assunto" required></textarea><br><br><br>
            
            <button type="submit">Enviar Formulário</button><br>
        </form>
    </div>
</section>
    <footer class="rodape"><p>© 2026 Explore o Mundo - Todos os direitos reservado.</p></footer>
</body>
</html>
